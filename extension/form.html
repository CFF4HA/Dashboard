<link rel="stylesheet" href="style.css">

<div class="modal-header">
  <h6 class="modal-title">Create Product</h6>
</div>

<div class="modal-body p-0">
  <form id="form-product_create" class="form-shell">

    <div class="mb-3">
      <label class="form-label">Name *</label>
      <input type="text" id="product-name" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Origin</label>
      <input type="text" id="product-origin" name="origin" class="form-control">
    </div>

    <hr class="form-divider">

    <div class="mb-1">
      <label class="form-label">Ingredients *</label>

      <div class="ingredient-tag-box" id="ingredient-tag-box">
        <input id="ingredient-tag-input"
               class="ingredient-tag-input"
               type="text"
               placeholder="Type names separated by commas…"
               autocomplete="off">
      </div>

      <div id="ingredient-hidden-inputs"></div>
    </div>

    <hr class="form-divider">

    <div class="d-flex justify-content-end gap-2">
      <button type="submit" class="btn-form-submit">Create</button>
    </div>

  </form>
</div>

<script src="popup.js"></script>
