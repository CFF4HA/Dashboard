{{ define "content"}}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragrance Free - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
        }
        .navbar-brand .fw-light {
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
        <div class="container-fluid">
            <div class="navbar-brand mb-0">
                <div style="line-height: 1.2;">
                    <span style="color: #333; font-weight: 400;">Frag</span><span style="color: #999; font-weight: 300;">rance</span>
                    <div style="color: #000; font-weight: 300; font-style: italic; font-size: 1.2rem; margin-top: -8px;">free</div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span>George Budell</span>
                <div class="rounded-circle bg-secondary" style="width: 40px; height: 40px;"></div>
                <!-- Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 100px;">
                        Options
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" style="min-width: 100px; max-width: 100px;">
                        <li><a class="dropdown-item text-center py-2" href="http://127.0.0.1:8080/settings" style="font-size: 0.875rem;">Settings</a></li>
                        <li><hr class="dropdown-divider" style="margin: 0;"></li>
                        <li><a class="dropdown-item text-danger text-center py-2" href="http://127.0.0.1:8080/login" style="font-size: 0.875rem;">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <h2 class="mb-4" style="font-size: 1.75rem; font-weight: 400;">Hello, George</h2>

        <!-- Search Input -->
        <div class="mb-4">
            <input 
                type="text" 
                class="form-control form-control-lg" 
                placeholder="Limonene"
                value="Limonene"
                style="border-radius: 8px; border: 2px solid #ddd; font-size: 1rem;"
            />
        </div>

        <!-- Ingredient Overview Card -->
        <div hx-get="/ingredientcard" hx-trigger="load"></div>
    </div>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{{ end }}
