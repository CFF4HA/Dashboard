<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fragrance Free</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link href="/static/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <style>
      :root {
        --forest-green: #1a2e1e;
        --mint-green: #CFF9C3;
        --soft-white: #EFEFEF;
        --regular-green: #274229;
      }

      body {
        background-color: var(--forest-green);
        font-family: 'Lato', sans-serif;
        color: var(--soft-white);
        margin: 0;
        min-height: 100vh;
      }

      h1, h2, h3 {
        font-family: 'Playfair Display', serif;
      }

      /* Simple navbar update to match new theme */
      .navbar-shell {
        display: flex;
        gap: 1rem;
        padding: 1rem;
        background: rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(207, 249, 195, 0.2);
      }
      
      .navbar-nav-btn {
        color: var(--soft-white);
        text-decoration: none;
        font-size: 0.9rem;
        opacity: 0.8;
      }
      
      .navbar-nav-btn:hover { color: var(--mint-green); opacity: 1; }
    </style>
  </head>
  <body>
    <div id="notification"></div>
    {{ template "content" . }}
    <script src="/static/htmx/htmx.min.js"></script>
  </body>
</html>
