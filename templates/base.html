<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="/static/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/bootstrap/icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <style>
    .navbar-shell {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      padding: 0.4rem 0.85rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0.5rem;
    }

    .navbar-brand-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #495057;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .navbar-brand-text:hover {
      color: #0d6efd;
    }

    .navbar-nav-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem;
    }

    .navbar-nav-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 0.3rem 0.65rem;
      font-size: 0.85rem;
      color: #adb5bd;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .navbar-nav-btn:hover {
      background: #e9ecef;
      color: #495057;
    }

    .navbar-nav-btn.active {
      background: #e9ecef;
      color: #0d6efd;
      font-weight: 500;
    }
  </style>
  <body>
    <nav class="navbar-shell">
      <div class="navbar-nav-group">
        <a href="/" class="navbar-nav-btn">
          <i class="bi bi-search"></i> Search
        </a>
        <a href="/products" class="navbar-nav-btn">
          <i class="bi bi-box-seam"></i> Product
        </a>
        <a href="/ingredients" class="navbar-nav-btn">
          <i class="bi bi-droplet-half"></i> Ingredient
        </a>
      </div>
    </nav>

    <div id="notification" class="m-2 p-1">
    </div>

    <div class="">
      {{ template "content" . }}
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div id="modal-content" class="modal-content">
        </div>
      </div>
    </div>
    <script src="/static/htmx/htmx.min.js"></script>
    <script src="/static/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
