{{ define "content" }}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        body {
            background-color: #ecedec;
        }

        /* Logo */
        .logo-text {
            font-weight: bold;
        }

        .logo-light {
            font-weight: normal;
        }

        /* Dark gray login card */
        .login-card {
            background-color: #2c2c2c;
            border-radius: 15px;
            width: 350px;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Labels */
        .form-label {
            color: #e0e0e0;
        }

        /* Inputs */
        .form-control {
            background-color: #444;
            border: none;
            color: white;
        }

        .form-control::placeholder {
            color: #bbb;
        }

        /* Buttons */
        .sign-in-btn {
            font-weight: 500;
        }

        .create-account-btn {
            width: 350px;
        }

        .btn-success {
            background-color: #bff8d4;
            border-color: #a3d9b2;
            color: #000000;
        }
    </style>
</head>

<body>

    <div class="min-vh-100 d-flex flex-column align-items-center justify-content-center">

        <!-- Logo -->
        <div class="text-center mb-4">
            <h1 class="logo-text">
                Fragrance<span class="logo-light"><i>free</i></span>
            </h1>
        </div>

        <!-- Login Card -->
        <div class="login-card p-4 mb-4">
            <h2 class="text-center mb-4">Login</h2>
            
            <!-- Form starts here -->
            <form action="/home">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter username">
                </div>
            
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password">
                </div>
            
                <button type="submit" class="btn btn-light w-100 sign-in-btn">
                    Sign In
                </button>
            </form>
            <!-- Form ends here -->
        </div>

        <!-- Create Account Section -->
        <div class="text-center">
            <p class="mb-1 fw-semibold">New to Fragrance Free?</p>
            <p class="mb-3">Create an account for personalized results.</p>
            
            <button class="btn btn-success mb-3 create-account-btn">
                Create Account
            </button>
            
            <p class="text-muted mb-0">
                Or 
                <a href="#" class="text-decoration-none text-dark">
                    continue as a guest
                </a>
            </p>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

{{ end }}
