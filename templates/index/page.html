<style>
.btn-registry {
    background-color: #000;
    color: #fff;
    border: 1px solid #000;
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    outline: none;
}

.btn-registry:hover {
    background-color: #fff;
    color: #000;
    box-shadow: 4px 4px 0px 0px #000;
    transform: translate(-2px, -2px);
}
</style>
