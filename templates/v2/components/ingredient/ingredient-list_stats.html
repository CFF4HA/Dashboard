<div class="d-grid gap-3">
  {{- with .Request }}
  {{- range $key, $value := .Values }}
  <input class="inputx" type="hidden" name="{{ $key }}" value="{{- range $value -}}{{ . }},{{- end -}}">
  {{- end }}
  {{- end }}
  <div class="d-flex justify-content-between align-items-center p-2 rounded-3 bg-white px-3 shadow-sm">
    <span class="small fw-bold text-secondary">Hazards Found</span>
    <span class="badge bg-soft-hazard rounded-pill">{{ .Counts.hazard | default "0" }}</span>
  </div>
  <div class="d-flex justify-content-between align-items-center p-2 rounded-3 bg-white px-3 shadow-sm">
    <span class="small fw-bold text-secondary">Symptoms</span>
    <span class="badge bg-soft-symptom rounded-pill">{{ .Count.symptom | default "0" }}</span>
  </div>
  <div class="d-flex justify-content-between align-items-center p-2 rounded-3 bg-white px-3 shadow-sm">
    <span class="small fw-bold text-secondary">Regulations</span>
    <span class="badge bg-soft-reg rounded-pill">{{ .Count.regulation | default "0" }}</span>
  </div>
</div>
