<div class="">
  <button class="btn btn-dark btn-sm text-center p-1 w-100">Not the one you're looking for? Start a search...</button>
  {{- if .Names }}
  <div class="accordion accordion-flush" id="namesAccordion">
    {{- range $index, $name := .Names }}
    <div class="accordion-item">
      <h2 class="accordion-header" id="heading-{{$index}}">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{$index}}" aria-expanded="false" aria-controls="collapse-{{$index}}">
          {{$name.Text}}
        </button>
      </h2>
      <div id="collapse-{{$index}}" class="accordion-collapse collapse" aria-labelledby="heading-{{$index}}" data-bs-parent="#namesAccordion">
        <div class="accordion-body">
          More information about {{$name.Text}} goes here.
        </div>
      </div>
    </div>
    {{- end }}
  </div>
  {{- end }}
</div>
