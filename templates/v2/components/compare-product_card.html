{{- with .Product }}
<style>
  /* ── Ingredient Pills ── */
  .cpc-pill-container {
    display: flex; 
    flex-wrap: wrap; 
    gap: 0.35rem; 
    max-height: 80px; 
    overflow-y: auto; 
    padding: 0.5rem;
    background: var(--soft-white);
    border-radius: 8px;
    border: 1px inset rgba(0,0,0,0.02);
  }

  .cpc-pill-container::-webkit-scrollbar { width: 3px; }
  .cpc-pill-container::-webkit-scrollbar-thumb { background: var(--apothecary-border); border-radius: 10px; }

  .cpc-pill {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--forest-green);
    background: #ffffff;
    border: 1px solid var(--apothecary-border);
    border-radius: 6px;
    padding: 0.1rem 0.4rem;
    white-space: nowrap;
  }

  /* ── Voting Row ── */
  .cpc-vote-row {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--apothecary-border);
  }

  .cpc-vote-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.4rem;
    border-radius: 10px;
    border: 1px solid var(--apothecary-border);
    background: #fff;
    color: #94a3b8;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .cpc-vote-btn:hover { border-color: #cbd5e1; color: #64748b; background: var(--soft-white); }
  
  /* Active States */
  .cpc-vote-btn.cpc-vote-good--active { 
    background: #f0fdf4; 
    border-color: #4ade80; 
    color: #16a34a; 
    box-shadow: 0 2px 8px rgba(74, 222, 128, 0.2);
  }
  
  .cpc-vote-btn.cpc-vote-bad--active { 
    background: #fef2f2; 
    border-color: #f87171; 
    color: #dc2626; 
    box-shadow: 0 2px 8px rgba(248, 113, 113, 0.2);
  }
</style>

<div class="compare-carousel-item" id="compare-item-{{ .Id }}">
  <div class="compare-product-card"
       data-bs-toggle="tab"
       data-bs-target="#unique-tab-{{ .Id }}"
       role="button"
       tabindex="0">
    
    <button class="btn-icon position-absolute top-0 end-0 m-2" 
            onclick="compareRemoveProduct('{{ .Id }}', event)" 
            title="Remove from comparison">
      <i class="bi bi-x-circle text-muted"></i>
    </button>

    <p class="compare-product-name pe-4">{{ .Name }}</p>
    
    <div class="cpc-pill-container mb-2">
      {{- range .Ingredients }}
      <span class="cpc-pill">{{ .PrimaryName }}</span>
      {{- end }}
    </div>
    
    <div class="d-flex justify-content-between align-items-center">
        <span class="text-muted" style="font-size: 0.65rem; font-weight: 600;">
          {{ len .Ingredients }} SUBSTANCES
        </span>
    </div>

    <div class="cpc-vote-row">
      <button class="cpc-vote-btn" id="cpc-good-{{ .Id }}"
              onclick="cpcToggleVote(event, 'good', '{{ .Id }}')">
        <i class="bi bi-shield-check"></i> Safe
      </button>
      <button class="cpc-vote-btn" id="cpc-bad-{{ .Id }}"
              onclick="cpcToggleVote(event, 'bad', '{{ .Id }}')">
        <i class="bi bi-shield-exclamation"></i> Reacts
      </button>
    </div>
  </div>
</div>

<script>
  /**
   * Store product ingredient data globally for the Investigation logic
   */
  window.__cpcProductIngredients = window.__cpcProductIngredients || {};
  window.__cpcProductIngredients['{{ .Id }}'] = [
    {{- range .Ingredients }}
    { id: '{{ .Id }}', name: '{{ .PrimaryName | js }}' },
    {{- end }}
  ];

  /**
   * Toggles the Safe/Reacts vote and communicates with the investigation view
   */
  function cpcToggleVote(event, type, id) {
    event.stopPropagation();
    const goodBtn = document.getElementById('cpc-good-' + id);
    const badBtn  = document.getElementById('cpc-bad-' + id);

    let active = false;

    if (type === 'good') {
      const wasActive = goodBtn.classList.contains('cpc-vote-good--active');
      active = !wasActive;
      goodBtn.classList.toggle('cpc-vote-good--active', active);
      badBtn.classList.remove('cpc-vote-bad--active');
      
      if (window.invUpdateBadIngredients) {
        window.invUpdateBadIngredients(id, 'good', active);
        window.invUpdateBadIngredients(id, 'bad', false);
      }
    } else {
      const wasActive = badBtn.classList.contains('cpc-vote-bad--active');
      active = !wasActive;
      badBtn.classList.toggle('cpc-vote-bad--active', active);
      goodBtn.classList.remove('cpc-vote-good--active');
      
      if (window.invUpdateBadIngredients) {
        window.invUpdateBadIngredients(id, 'good', false);
        window.invUpdateBadIngredients(id, 'bad', active);
      }
    }
  }
</script>
{{- end }}
