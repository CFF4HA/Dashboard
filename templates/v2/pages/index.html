{{ define "content" }}
<style>
  .profile-section {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 15px;
    margin-bottom: 2rem;
  }
  .profile-circle {
    width: 45px;
    height: 45px;
    background: white;
    border-radius: 50%;
  }
  .dashboard-greeting {
    font-size: 2.2rem;
    color: white;
    margin-bottom: 1rem;
    font-weight: 500;
  }
  .nav-btn-row {
    display: flex;
    gap: 0;
    margin-bottom: 2rem;
    border: 1px solid #CFF9C3;
    border-radius: 10px;
    overflow: hidden;
  }
  .nav-btn {
    flex: 1;
    background: #CFF9C3;
    color: #000000;
    padding: 10px 8px;
    text-align: center;
    text-decoration: none;
    font-size: 0.9rem;
    transition: all 0.2s ease;
    border-right: 1px solid #CFF9C3;
    cursor: pointer;
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn:hover { background: rgba(207, 249, 195, 0.1); color: #CFF9C3; }
  .nav-btn.active { background: #274229; color: white; }
</style>

<div class="container-fluid py-4 px-4 px-md-5">

  {{/* Profile Header */}}
  <div class="row">
    <div class="col-12">
      <div class="profile-section">
        <span class="text-white-50" style="font-size: 0.9rem;">{{.User.FirstName}} {{.User.LastName}}</span>
        <div class="profile-circle"></div>
        <div class="ms-2">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </div>
      </div>
    </div>
  </div>

  {{/* Branding */}}
  <div class="text-center mb-3">
    <h1 class="mt-3 mb-0" style="font-size: 3rem; color: white; font-family: 'Playfair Display', serif;">
      Fragrance <span style="color: #CFF9C3;">Free</span>
    </h1>
    <p style="letter-spacing: 2px; font-size: 0.8rem; opacity: 0.8; color: white;">
      clean spaces · healthy living
    </p>
  </div>

  {{/* Greeting */}}
  <h4 class="dashboard-greeting">Hello, {{.User.FirstName}}</h4>

  {{/* Nav Tabs */}}
  <div class="nav-btn-row">
    <button class="nav-btn active"
      hx-get="/htmx/tab-products"
      hx-target="#main-content"
      hx-swap="innerHTML"
      onclick="setActive(this)">Product</button>
    <button class="nav-btn"
      hx-get="/htmx/tab-ingredients"
      hx-target="#main-content"
      hx-swap="innerHTML"
      onclick="setActive(this)">Ingredient</button>
    <button class="nav-btn"
      hx-get="/htmx/tab-compare"
      hx-target="#main-content"
      hx-swap="innerHTML"
      onclick="setActive(this)">Compare</button>
    <button class="nav-btn"
      hx-get="/htmx/tab-user_dashboard"
      hx-target="#main-content"
      hx-swap="innerHTML"
      onclick="setActive(this)">User Dashboard</button>
  </div>


  {{/* Main Content Area — loads Product tab by default */}}
  <div id="main-content"
       hx-get="/htmx/tab-products"
       hx-trigger="load"
       hx-swap="innerHTML">
  </div>

</div>

<script>
  function setActive(el) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
  }
</script>
{{ end }}
