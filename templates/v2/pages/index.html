{{ define "content" }}
<style>
  /* Header & Profile */
  .profile-section {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 15px;
    margin-bottom: 2rem;
  }
  .profile-circle {
    width: 45px;
    height: 45px;
    background: white;
    border-radius: 50%;
  }

  /* Branding */
  .brand-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 2.5rem;
  }
  .brand-logo-circle {
    width: 100px;
    height: 100px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid #CFF9C3;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    line-height: 0.9;
    margin: 0;
    color: white;
  }

  /* Navigation Buttons Row */
  .nav-btn-row {
    display: flex;
    gap: 10px;
    margin-bottom: 2rem;
  }
  .nav-btn {
    flex: 1;
    background: #274229;
    border: 1px solid #CFF9C3;
    color: white;
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    text-decoration: none;
    font-size: 0.9rem;
    transition: all 0.2s ease;
  }
  .nav-btn:hover {
    background: rgba(207, 249, 195, 0.1);
    color: #CFF9C3;
  }

  /* Dashboard Greeting */
  .dashboard-greeting {
    font-size: 2.2rem;
    color: white;
    margin-bottom: 1rem;
    font-weight: 500;
  }

  /* Main Overview Container (The Bordered Box) */
  .overview-container {
    border: 1px solid rgba(207, 249, 195, 0.4);
    border-radius: 15px;
    padding: 2rem;
    margin-top: 1.5rem;
  }

  /* Table Grid Styles */
  .ingredient-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: white;
    border-radius: 12px;
    overflow: hidden;
    color: #1a2e1e;
    margin-bottom: 1.5rem;
  }
  .grid-header {
    font-weight: 800;
    font-size: 0.85rem;
    padding: 0.75rem;
    border-bottom: 1px solid #eee;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .grid-content {
    padding: 1.2rem;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
  }
  .border-x {
    border-left: 1px solid #eee;
    border-right: 1px solid #eee;
  }

  /* Info Cards */
  .info-card {
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    color: #1a2e1e;
    margin-bottom: 1.2rem;
  }
  .tag-list span {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 2px;
    color: #444;
  }
</style>

<div class="container-fluid py-4 px-4 px-md-5">
  <div class="row">
    <div class="col-12">
      <div class="profile-section">
        <span class="text-white-50" style="font-size: 0.9rem;">{{.FirstName}} {{.LastName}}</span>
        <div class="profile-circle"></div>
        <div class="ms-2">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>
      </div>
    </div>
  </div>

    <div class="text-center brand-logo-container">
      <h1 class="mt-3 mb-0" style="font-size: 3rem;">
        Fragrance <span style="color: #CFF9C3;">Free</span>
      </h1>
      <p style="letter-spacing: 2px; font-size: 0.8rem; opacity: 0.8;">
        clean spaces · healthy living
      </p>
    </div>

  <h1 class="dashboard-greeting">Hello, {{.FirstName}}</h1>

  <div hx-get="/htmx/searchbar-manual_search" hx-trigger="load" hx-swap="outerHTML"></div>

  <div class="nav-btn-row mt-3">
    <a href="/search" class="nav-btn">Search</a>
    <a href="/products" class="nav-btn">Product</a>
    <a href="/ingredients" class="nav-btn">Ingredient</a>
    <a href="/compare" class="nav-btn">Compare</a>
  </div>
</div>
{{ end }}
