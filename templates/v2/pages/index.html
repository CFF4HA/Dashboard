<canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>

<div class="container-fluid py-5 g-5">
  <div class="row">
    {{/* Content */}}
    <div class="col my-3">
      <div class="text-center">
        <img src="/static/github-ff-banner.png" class="img-fluid"/>
        <p class="lead text-muted">Your comprehensive database for ingredient information and analysis.</p>
      </div>

      <div hx-get="/htmx/searchbar-manual_search" hx-trigger="load" hx-swap="outerHTML" class="col my-4"></div>

    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');

  const SPACING     = 52;          // px between grid lines
  const RAD         = 260;         // influence radius
  const MAX_DISP    = SPACING * 0.55;  // hard cap: ~28px, never more than 55% of a cell
  const SIGMA       = RAD / 3;     // Gaussian width (~87px)
  const RIPPLE_AMP  = 5;           // px — subtle wake ring amplitude
  const SPEED       = 1.1;         // particle px/frame
  let   time        = 0;

  let W, H;
  let mouse = null;   // null = off-screen

  // Single particle — starts at a random position with a fixed velocity
  const p = { x: 0, y: 0, vx: SPEED, vy: SPEED * 0.6 };

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    // Seed particle roughly center-ish on first load
    if (p.x === 0 && p.y === 0) { p.x = W * 0.35; p.y = H * 0.4; }
  }

  // Displacement of grid vertex (gx, gy) toward the particle
  function displaced(gx, gy) {
    const dx   = gx - p.x;
    const dy   = gy - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist === 0 || dist > RAD) return { x: gx, y: gy };

    // Gaussian core — smoothly peaks at dist=0, no singularity, hard-capped magnitude
    const gauss = Math.exp(-(dist * dist) / (2 * SIGMA * SIGMA));
    const pull  = gauss * MAX_DISP;

    // Ripple ring — sinusoidal wake that radiates outward, fades toward the edge
    const ripple = Math.sin(dist * (Math.PI * 3 / RAD) - time * 0.04)
                   * RIPPLE_AMP
                   * (1 - dist / RAD);

    const total = pull + ripple;
    const ux = dx / dist, uy = dy / dist;   // unit vector away from particle
    return { x: gx - ux * total, y: gy - uy * total };
  }

  function tick() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const cols = Math.ceil(W / SPACING) + 2;
    const rows = Math.ceil(H / SPACING) + 2;
    const ox   = -SPACING + ((W % SPACING) / 2);
    const oy   = -SPACING + ((H % SPACING) / 2);

    // --- Grid lines ---
    ctx.lineWidth = 0.75;

    // Horizontal
    for (let r = 0; r < rows; r++) {
      const baseY = oy + r * SPACING;
      ctx.beginPath();
      for (let c = 0; c < cols; c++) {
        const pt = displaced(ox + c * SPACING, baseY);
        c === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
      }
      ctx.strokeStyle = 'rgba(175,175,175,0.55)';
      ctx.stroke();
    }

    // Vertical
    for (let c = 0; c < cols; c++) {
      const baseX = ox + c * SPACING;
      ctx.beginPath();
      for (let r = 0; r < rows; r++) {
        const pt = displaced(baseX, oy + r * SPACING);
        r === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
      }
      ctx.strokeStyle = 'rgba(175,175,175,0.55)';
      ctx.stroke();
    }

    // --- Intersection dots (regular gray) ---
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const pt = displaced(ox + c * SPACING, oy + r * SPACING);
        // Highlight nodes close to the particle
        const dx   = (ox + c * SPACING) - p.x;
        const dy   = (oy + r * SPACING) - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < RAD) {
          const t = 1 - dist / RAD;
          ctx.fillStyle = `rgba(120,120,120,${0.35 + t * 0.55})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 1.5 + t * 1.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(175,175,175,0.45)';
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }


    // --- Move & wrap ---
    time++;
    if (mouse) {
      // Smoothly follow the cursor (lerp at 8% per frame)
      p.x += (mouse.x - p.x) * 0.08;
      p.y += (mouse.y - p.y) * 0.08;
    } else {
      // Autonomous drift when mouse is off-screen
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0)  p.x = W;
      if (p.x > W)  p.x = 0;
      if (p.y < 0)  p.y = H;
      if (p.y > H)  p.y = 0;
    }

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize',    () => resize());
  window.addEventListener('mousemove', e  => { mouse = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('mouseleave',()  => { mouse = null; });

  resize();
  tick();
})();
</script>
