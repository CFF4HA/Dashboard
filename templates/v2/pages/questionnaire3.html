{{ define "content" }}
<style>
  .q-container { max-width: 600px; margin: 0 auto; }
  .q-card {
    background-color: #274229;
    border: 2px solid var(--mint-green);
    border-radius: 15px;
    padding: 2.5rem;
  }
  .form-label { font-weight: 500; margin-top: 1.5rem; display: block; font-size: 1.1rem; }
  .form-control { background-color: white; border-radius: 8px; border: none; padding: 0.75rem; }
  
  /* Styling Checkboxes/Radios to look like the mock */
  .form-check-input:checked { background-color: var(--mint-green); border-color: var(--mint-green); }
  .form-check-label { font-size: 0.95rem; color: rgba(255,255,255,0.9); }

    /* Previous Button - Soft White/Grey background */
    .btn-previous {
    background-color: #EFEFEF;
    color: #1a2e1e;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 2.5rem;
    font-weight: 700;
    text-decoration: none; /* Removes underline from <a> tag */
    display: inline-block;
    min-width: 140px;
    text-align: center;
    }

    .btn-previous:hover {
    background-color: #d1d1d1;
    color: #1a2e1e;
    }

    /* Next Button - Mint Green background */
    .btn-next {
    background-color: #CFF9C3;
    color: #1a2e1e;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 2.5rem;
    font-weight: 700;
    min-width: 140px;
    }

    .btn-next:hover {
        background-color: #819c7a;
    }

    .brand-logo-container { margin-bottom: 3rem; }

  .btn-finish {
    background-color: #CFF9C3;
    color: #1a2e1e;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 2.5rem;
    font-weight: 700;
    min-width: 140px;
  }

  .btn-finish:hover {
    background-color: #819c7a;
  }
</style>

<div class="container py-5 q-container">
  <div class="text-center brand-logo-container">
    <h1 class="mt-3 mb-0" style="font-size: 3rem;">Fragrance <span style="color: #CFF9C3;">Free</span></h1>
    <p style="letter-spacing: 2px; font-size: 0.8rem; opacity: 0.8;">clean spaces · healthy living</p>
  </div>

  <div class="mb-4">
    <div class="d-flex justify-content-between mb-2">
      <span class="small" style="color: var(--mint-green); font-weight: 700;">Step 3 of 4</span>
      <span class="small" style="opacity: 0.7;">66%</span>
    </div>
    <div class="progress" style="height: 8px; background-color: rgba(255, 255, 255, 0.1); border-radius: 10px;">
      <div class="progress-bar" role="progressbar" 
           style="width: 66%; background-color: #CFF9C3; border-radius: 10px; transition: width 0.5s ease;">
      </div>
    </div>
  </div>

  <div class="q-card">
    <h2 class="mb-4" style="font-size: 1.8rem;">Product Preferences</h2>
    
    <form action="/create-login" method="GET">
      <label class="form-label">What product categories are most important to you?</label>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Household cleaning</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Laundry</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Personal care</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Baby & infant products</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Air care</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Pet care</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Office & workplace products</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Building materials & paints</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Other</label></div>

      <label class="form-label">Any other product preferences?</label>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Fragrance-free</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Vegan</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Cruelty-free</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Unscented</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Certified organic</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">EWG Verified or similar third-party certified</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Dye-free</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Hypoallergenic labeled</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Made in USA</label></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Other</label></div>

      <div class="d-flex justify-content-center gap-3 mt-5">
          <a href="/questionnaire/step-2" class="btn btn-previous">Previous</a>
          <button type="submit" class="btn btn-finish">Finish</button>
      </div>
    </form>
  </div>
</div>
{{ end }}
