<style>
  /* ── Core Variables ── */
  :root {
    --forest-green: #1a2e1c;
    --regular-green: #2d4a2e;
    --soft-white: #ffffff;
    --apothecary-border: rgba(39, 66, 41, 0.12);
  }

  /* ── Typography & Container ── */
  .search-container {
    font-family: 'Lato', sans-serif !important;
    max-width: 700px; 
    margin: 0 auto;
    padding: 3rem 1rem;
  }

  .search-container input, 
  .search-container button, 
  .search-container select {
    font-family: 'Lato', sans-serif !important;
  }

  /* ── Minimalist Header ── */
  .search-header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .search-title {
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #adb5bd;
    margin-bottom: 0.5rem;
  }

  /* ── Integrated Search Wrapper ── */
  .search-box-group {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background: #ffffff;
    border: 1px solid var(--apothecary-border);
    border-radius: 20px;
    padding: 1.25rem;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
    transition: border-color 0.3s ease;
  }

  .search-box-group:focus-within {
    border-color: var(--regular-green);
  }

  .search-input-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .search-main-input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--forest-green);
    font-size: 1.1rem;
    outline: none;
    font-weight: 500;
  }

  /* ── Refined Mode & Action Buttons ── */
  .btn-mode-toggle {
    background: var(--soft-white);
    border: 1px solid var(--apothecary-border);
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: #000;
    text-transform: uppercase;
  }

  .btn-create-inline {
    background: var(--forest-green);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.4rem 1rem;
    font-size: 0.75rem;
    font-weight: 700;
    white-space: nowrap;
    transition: background 0.2s;
  }

  .btn-create-inline:hover {
    background: #000;
  }

  /* ── Filter Row ── */
  .filter-row {
    display: flex;
    gap: 0.5rem;
    padding-top: 0.75rem;
    border-top: 1px solid rgba(0,0,0,0.05);
  }

  .filter-select, .filter-text {
    background: var(--soft-white);
    border: 1px solid var(--apothecary-border);
    border-radius: 8px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    color: var(--forest-green);
    outline: none;
  }

  .filter-text { flex: 1; }

  .search-hint {
    text-align: center;
    font-size: 0.75rem;
    color: #adb5bd;
    margin-top: 1rem;
  }
</style>

{{- with .Search }}
<div id="searchbar-manual_search" class="search-container">

  <div class="search-box-group">
    <div class="search-input-row">
      <i class="bi bi-search text-success"></i>
      <input type="text"
        class="search-main-input"
        placeholder="Search {{ .Active.ActiveSearchMode | lower }}s..."
        name="query"
        hx-get="{{ .Active.Target }}"
        hx-trigger="keyup changed delay:400ms, tagFilterChanged from:body"
        hx-target="#search-results"
        hx-swap="innerHTML"
        hx-include="[name='label_filter_op'], [name='label_filter_text'], [name='tag_filter']"
      >
      
      <div class="dropdown">
        <button class="btn-mode-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown">
          {{- .Active.ActiveSearchMode -}}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0">
          {{- range .Others }}
          <li><a class="dropdown-item py-2 fw-bold" style="font-size: 0.75rem;"
            hx-get="/htmx/searchbar-manual_search?search_mode={{ .ActiveSearchMode | urlquery }}"
            hx-target="#searchbar-manual_search"
            hx-swap="outerHTML"
          >{{ .ActiveSearchMode }}</a></li>
          {{- end }}
        </ul>
      </div>

      <button class="btn-create-inline"
        hx-get="/htmx/form-product_create"
        hx-target="#modal-content"
        data-bs-toggle="modal"
        data-bs-target="#modal">
        <i class="bi bi-plus-lg"></i> Create
      </button>
    </div>

    {{- if or (eq .Active.ActiveSearchMode "Product") (eq .Active.ActiveSearchMode "Ingredient") }}
    <div class="filter-row">
      <select name="label_filter_op" class="filter-select"
              hx-get="{{ .Active.Target }}"
              hx-trigger="change"
              hx-target="#search-results"
              hx-include="[name='query'], [name='label_filter_text'], [name='tag_filter']">
        <option value="contains">Label Contains</option>
        <option value="excludes">Exclude Label</option>
      </select>
      <input type="text" name="label_filter_text" class="filter-text"
             placeholder="Additional filter criteria..."
             hx-get="{{ .Active.Target }}"
             hx-trigger="keyup changed delay:400ms"
             hx-target="#search-results"
             hx-include="[name='query'], [name='label_filter_op'], [name='tag_filter']">
    </div>
    {{- end }}
  </div>

  <div id="tag-filter" class="mt-2" hx-get="/htmx/tag-filter" hx-trigger="load"></div>

  <p class="search-hint">
    <i class="bi bi-info-circle"></i> {{ .Active.Description }}
  </p>

</div>

<div id="search-results" class="container"></div>
{{- end }}
