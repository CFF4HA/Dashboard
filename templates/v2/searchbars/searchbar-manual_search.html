<style>
  :root {
    --searchbar-focus: #CFF9C3;
    --searchbar-text: #1a2e1e;
  }

  #searchbar-manual_search {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .searchbar-row {
    display: flex;
    gap: 0;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #CFF9C3;
  }

  .searchbar-input {
    flex: 1;
    border: none;
    background: white;
    padding: 0.65rem 1rem;
    font-size: 0.95rem;
    color: var(--searchbar-text);
    outline: none;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .searchbar-input::placeholder {
    color: #adb5bd;
  }

  .searchbar-submit-btn {
    flex-shrink: 0;
    background: #CFF9C3;
    border: none;
    padding: 0.65rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: #1a2e1e;
    cursor: pointer;
    transition: background 0.2s ease;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .searchbar-submit-btn:hover {
    background: #b8f0a8;
  }

  .sb-filter-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .sb-filter-op,
  .sb-filter-input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(207, 249, 195, 0.4);
    border-radius: 8px;
    padding: 0.3rem 0.7rem;
    font-size: 0.82rem;
    color: white;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .sb-filter-op {
    flex-shrink: 0;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
  }

  .sb-filter-op option {
    color: #1a2e1e;
    background: white;
  }

  .sb-filter-input {
    flex: 1 1 12rem;
    min-width: 0;
  }

  .sb-filter-input::placeholder {
    color: rgba(255,255,255,0.35);
  }

  .sb-filter-op:focus,
  .sb-filter-input:focus {
    border-color: #CFF9C3;
  }
</style>

{{- with .Search }}
<div id="searchbar-manual_search">

  <div class="searchbar-row">
    <input type="text"
      class="searchbar-input"
      placeholder="Search for a product..."
      aria-label="Search"
      name="query"
      hx-get="{{ .Active.Target }}"
      hx-trigger="keyup changed delay:500ms"
      hx-target="#search-results"
      hx-swap="innerHTML"
      hx-include="[name='label_filter_op'], [name='label_filter_text']"
      hx-vals='{"results_target": "#search-results"}'
    >
    <button class="searchbar-submit-btn"
      hx-get="{{ .Active.Target }}"
      hx-trigger="click"
      hx-target="#search-results"
      hx-swap="innerHTML"
      hx-include="[name='query'], [name='label_filter_op'], [name='label_filter_text']"
      hx-vals='{"results_target": "#search-results"}'
    >Search</button>
  </div>

  {{- if or (eq .Active.ActiveSearchMode "Product") (eq .Active.ActiveSearchMode "Ingredient") }}
  <div class="sb-filter-row">
    <select name="label_filter_op" class="sb-filter-op"
            aria-label="Label filter operator"
            hx-get="{{ .Active.Target }}"
            hx-trigger="change"
            hx-target="#search-results"
            hx-swap="innerHTML"
            hx-include="[name='query'], [name='label_filter_text']"
            hx-vals='{"results_target": "#search-results"}'>
      <option value="contains">Label contains</option>
      <option value="excludes">Label doesn't contain</option>
    </select>
    <input type="text" name="label_filter_text" class="sb-filter-input"
           placeholder="Filter by label payload (e.g. 'carcinogen')"
           aria-label="Label filter text"
           autocomplete="off"
           hx-get="{{ .Active.Target }}"
           hx-trigger="keyup changed delay:500ms"
           hx-target="#search-results"
           hx-swap="innerHTML"
           hx-include="[name='query'], [name='label_filter_op']"
           hx-vals='{"results_target": "#search-results"}'>
  </div>
  {{- end }}

  <div id="search-results" class="mt-3"></div>

</div>

{{- else }}
<h5 class="text-center text-muted">No search configuration found.</h5>
{{- end }}
