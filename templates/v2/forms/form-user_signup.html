<style>
  /* ── Apothecary Form Shell: Strict Green & Neutral ── */
  .form-shell {
    background: #ffffff;
    border: 1px solid var(--apothecary-border);
    border-radius: 20px;
    padding: 2.5rem;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--forest-green);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
  }

  .form-shell .form-label {
    font-size: 0.65rem;
    font-weight: 800;
    color: #94a3b8; /* Slate Neutral */
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
    display: block;
  }

  .form-shell .form-control {
    background: var(--soft-white);
    border: 1px solid var(--apothecary-border);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    color: var(--forest-green);
    transition: all 0.2s ease;
  }

  .form-shell .form-control::placeholder {
    color: #cbd5e1;
  }

  .form-shell .form-control:focus {
    background: #ffffff;
    border-color: var(--forest-green);
    box-shadow: 0 0 0 3px rgba(26, 46, 28, 0.05);
    outline: none;
  }

  /* ── Action Button: Monochromatic Forest ── */
  .btn-form-submit {
    background: var(--forest-green);
    border: 1px solid var(--forest-green);
    border-radius: 12px;
    padding: 0.8rem 1.5rem;
    font-size: 0.85rem;
    color: #ffffff;
    cursor: pointer;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
  }

  .btn-form-submit:hover {
    background: #233d25; /* Slightly deeper green */
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(26, 46, 28, 0.15);
  }

  .form-divider {
    border: none;
    border-top: 1px solid var(--apothecary-border);
    margin: 2rem 0;
  }

  /* ── Link: Forest Green Accent ── */
  .auth-link {
    color: var(--forest-green);
    text-decoration: underline;
    text-decoration-color: #cbd5e1;
    font-weight: 700;
    transition: color 0.2s ease;
  }

  .auth-link:hover {
    color: #233d25;
    text-decoration-color: var(--forest-green);
  }
</style>

<div id="auth-panel" class="d-flex justify-content-center py-5">
  <form class="form-shell"
        style="width: 100%; max-width: 420px;"
        hx-put="/user"
        hx-target="#auth-panel"
        hx-swap="outerHTML">

    <div class="text-center mb-5">
      <div class="mb-3" style="font-size: 2.5rem; color: var(--forest-green); opacity: 0.9;">
        <i class="bi bi-person-badge"></i>
      </div>
      <h5 class="fw-bold m-0" style="color: var(--forest-green); letter-spacing: -0.02em;">Create Account</h5>
    </div>

    <div class="mb-4">
      <label for="signup-username" class="form-label">Create Username</label>
      <input type="text"
             id="signup-username"
             name="username"
             class="form-control"
             placeholder="Choose an alias"
             autocomplete="username"
             required
             autofocus>
    </div>

    <div class="mb-4">
      <label for="signup-password" class="form-label">Create Password</label>
      <input type="password"
             id="signup-password"
             name="password"
             class="form-control"
             placeholder="••••••••"
             autocomplete="new-password"
             required>
    </div>

    <hr class="form-divider">

    <button type="submit" class="btn-form-submit w-100">
      Create Account <i class="bi bi-arrow-right"></i>
    </button>

    <div class="text-center mt-4" style="font-size: 0.85rem; color: #94a3b8;">
      Already registered in the archives? 
      <a href="/login" class="auth-link">Access Terminal</a>
    </div>
  </form>
</div>
