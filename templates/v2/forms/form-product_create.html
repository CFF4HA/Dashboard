<style>
  .form-shell {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #495057;
  }

  .form-shell .form-label {
    font-size: 0.85rem;
    font-weight: 500;
    color: #495057;
    margin-bottom: 0.3rem;
  }

  .form-shell .form-control {
    background: #ffffff;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 0.35rem 0.75rem;
    font-size: 0.9rem;
    color: #495057;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .form-shell .form-control::placeholder {
    color: #adb5bd;
  }

  .form-shell .form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    outline: none;
  }

  .form-shell .form-text {
    font-size: 0.78rem;
    color: #adb5bd;
  }

  .ingredient-row {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    margin-bottom: 0.4rem;
  }

  .ingredient-row .form-control {
    flex: 1;
  }

  .btn-ingredient-remove {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 0.3rem 0.55rem;
    font-size: 0.8rem;
    color: #adb5bd;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    line-height: 1;
  }

  .btn-ingredient-remove:hover {
    background: #e9ecef;
    color: #495057;
    border-color: #adb5bd;
  }

  .ingredient-tag-box {
    background: #ffffff;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 0.35rem 0.6rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    cursor: text;
  }

  .ingredient-tag-box:focus-within {
    border-color: #0d6efd;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  }

  .ingredient-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 20px;
    padding: 0.1rem 0.5rem;
    font-size: 0.78rem;
    color: #495057;
    white-space: nowrap;
  }

  .ingredient-tag-remove {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.7rem;
    color: #adb5bd;
    cursor: pointer;
    line-height: 1;
    transition: color 0.15s ease;
  }

  .ingredient-tag-remove:hover {
    color: #495057;
  }

  .ingredient-tag-input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 0.88rem;
    color: #495057;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    flex: 1;
    min-width: 8rem;
    padding: 0.1rem 0;
  }

  .ingredient-tag-input::placeholder {
    color: #adb5bd;
  }

  .btn-form-submit {
    background: #0d6efd;
    border: none;
    border-radius: 8px;
    padding: 0.4rem 1.1rem;
    font-size: 0.85rem;
    color: #ffffff;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s ease;
  }

  .btn-form-submit:hover {
    background: #0b5ed7;
  }

  .btn-form-cancel {
    background: transparent;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 0.4rem 1.1rem;
    font-size: 0.85rem;
    color: #adb5bd;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .btn-form-cancel:hover {
    background: #e9ecef;
    color: #495057;
  }

  .form-divider {
    border: none;
    border-top: 1px solid #dee2e6;
    margin: 1rem 0;
  }
</style>

<div class="modal-header" style="border-bottom: 1px solid #dee2e6; padding: 0.85rem 1.5rem;">
  <h6 class="modal-title mb-0" style="font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 0.95rem; font-weight: 600; color: #495057;">
    <i class="bi bi-box-seam me-2" style="color: #adb5bd;"></i>Create Product
  </h6>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="font-size: 0.75rem;"></button>
</div>

<div class="modal-body p-0">
  <form id="form-product_create"
        class="form-shell"
        hx-put="/product"
        hx-target="#notification"
        hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) bootstrap.Modal.getInstance(document.getElementById('modal')).hide()">

    <div class="mb-3">
      <label for="product-name" class="form-label">Name <span style="color: #dc3545;">*</span></label>
      <input type="text"
             id="product-name"
             name="name"
             class="form-control"
             placeholder="e.g. Sunscreen SPF 50"
             autocomplete="off"
             required>
    </div>

    <div class="mb-3">
      <label for="product-origin" class="form-label">Origin</label>
      <input type="text"
             id="product-origin"
             name="origin"
             class="form-control"
             placeholder="e.g. United States"
             autocomplete="off">
      <div class="form-text">Optional - a link to the product (i.e., Amazon, etc).</div>
    </div>

    <hr class="form-divider">

    <div class="mb-1">
      <label class="form-label">Ingredients <span style="color: #dc3545;">*</span></label>
      <div class="ingredient-tag-box" id="ingredient-tag-box" onclick="document.getElementById('ingredient-tag-input').focus()">
        <input
          id="ingredient-tag-input"
          class="ingredient-tag-input"
          type="text"
          placeholder="Type names separated by commas…"
          autocomplete="off"
          oninput="handleIngredientInput(event)"
          onkeydown="handleIngredientKeydown(event)">
      </div>
      <div id="ingredient-hidden-inputs"></div>
      <div class="form-text mt-1">Separate multiple ingredients with a comma. At least one is required.</div>
    </div>

    <hr class="form-divider">

    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn-form-cancel" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn-form-submit">
        <i class="bi bi-check2 me-1"></i>Create
      </button>
    </div>
  </form>
</div>

<script>
  function handleIngredientInput(e) {
    const raw = e.target.value;
    // Only split on ", " (comma + space) to preserve names like "1,2-hexanediol"
    const parts = raw.split(', ');
    if (parts.length > 1) {
      parts.slice(0, -1).forEach(p => commitIngredient(p.trim()));
      e.target.value = parts[parts.length - 1];
    }
  }

  function handleIngredientKeydown(e) {
    const input = e.target;
    if ((e.key === 'Enter' || e.key === 'Tab') && input.value.trim()) {
      e.preventDefault();
      input.value.split(', ').forEach(p => commitIngredient(p.trim()));
      input.value = '';
    }
    // Backspace on empty input removes the last tag
    if (e.key === 'Backspace' && input.value === '') {
      const box = document.getElementById('ingredient-tag-box');
      const lastTag = box.querySelector('.ingredient-tag:last-of-type');
      if (lastTag) removeIngredient(lastTag.dataset.name, lastTag);
    }
  }

  function commitIngredient(name) {
    if (!name) return;
    const box = document.getElementById('ingredient-tag-box');
    const hiddenContainer = document.getElementById('ingredient-hidden-inputs');
    const input = document.getElementById('ingredient-tag-input');

    // Deduplicate
    if (box.querySelector(`.ingredient-tag[data-name="${CSS.escape(name)}"]`)) return;

    const tag = document.createElement('span');
    tag.className = 'ingredient-tag';
    tag.dataset.name = name;
    tag.innerHTML = `${name}<button type="button" class="ingredient-tag-remove" aria-label="Remove ${name}" onclick="removeIngredient('${name.replace(/'/g, "\\'")}', this.parentElement)"><i class="bi bi-x"></i></button>`;
    box.insertBefore(tag, input);

    const hidden = document.createElement('input');
    hidden.type = 'hidden';
    hidden.name = 'ingredient_names';
    hidden.value = name;
    hidden.dataset.tag = name;
    hiddenContainer.appendChild(hidden);
  }

  function removeIngredient(name, tagEl) {
    tagEl.remove();
    const hidden = document.querySelector(`#ingredient-hidden-inputs input[data-tag="${CSS.escape(name)}"]`);
    if (hidden) hidden.remove();
  }
</script>
