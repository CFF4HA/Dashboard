<style>
  /* ── Core Variables ── */
  :root {
    --forest-green: #1a2e1c;
    --regular-green: #2d4a2e;
    --soft-white: #f8f9fa;
    --apothecary-border: rgba(39, 66, 41, 0.12);
  }

  /* ── Form Shell ── */
  .form-shell {
    background: #ffffff;
    border-radius: 12px;
    padding: 1.5rem;
    font-family: 'Lato', sans-serif !important;
    color: var(--forest-green);
  }

  .form-shell .form-label {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #adb5bd;
    margin-bottom: 0.4rem;
  }

  .form-shell .form-control {
    background: #ffffff;
    border: 1px solid var(--apothecary-border);
    border-radius: 10px;
    padding: 0.5rem 0.8rem;
    font-size: 0.9rem;
    color: var(--forest-green);
    transition: all 0.2s ease;
  }

  .form-shell .form-control:focus {
    border-color: var(--regular-green);
    box-shadow: 0 0 0 3px rgba(45, 74, 46, 0.1);
    outline: none;
  }

  .form-shell .form-text {
    font-size: 0.75rem;
    color: #adb5bd;
    font-style: italic;
  }

  /* ── Tag Box Integration ── */
  .ingredient-tag-box {
    background: #ffffff;
    border: 1px solid var(--apothecary-border);
    border-radius: 10px;
    padding: 0.4rem 0.6rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    align-items: center;
    min-height: 45px;
    cursor: text;
    transition: border-color 0.2s;
  }

  .ingredient-tag-box:focus-within {
    border-color: var(--regular-green);
  }

  .ingredient-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--soft-white);
    border: 1px solid var(--apothecary-border);
    border-radius: 6px;
    padding: 0.2rem 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--forest-green);
  }

  .ingredient-tag-remove {
    background: none;
    border: none;
    padding: 0;
    color: #e07a7a;
    cursor: pointer;
    display: flex;
    align-items: center;
  }

  .ingredient-tag-input {
    border: none !important;
    outline: none !important;
    background: transparent;
    font-size: 0.9rem;
    flex: 1;
    min-width: 120px;
    color: var(--forest-green);
  }

  /* ── Buttons ── */
  .btn-form-submit {
    background: var(--forest-green);
    border: none;
    border-radius: 8px;
    padding: 0.5rem 1.5rem;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #ffffff;
    transition: background 0.2s;
  }

  .btn-form-submit:hover {
    background: #000000;
  }

  .btn-form-cancel {
    background: transparent;
    border: 1px solid var(--apothecary-border);
    border-radius: 8px;
    padding: 0.5rem 1.2rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: #adb5bd;
  }

  .form-divider {
    border-top: 1px solid var(--apothecary-border);
    margin: 1.5rem 0;
    opacity: 1;
  }
</style>

<div class="modal-header px-4 py-3 border-0">
  <h6 class="modal-title mb-0" style="font-family: 'Lato', sans-serif; font-weight: 800; color: var(--forest-green); text-transform: uppercase; letter-spacing: 0.1em;">
    <i class="bi bi-plus-circle me-2"></i>Create Product
  </h6>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body p-0">
  <form id="form-product_create"
        class="form-shell"
        hx-put="/product"
        hx-target="#notification"
        hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) bootstrap.Modal.getInstance(document.getElementById('modal')).hide()">

    <div class="mb-4">
      <label for="product-name" class="form-label">Product Name <span style="color: #e07a7a;">*</span></label>
      <input type="text"
             id="product-name"
             name="name"
             class="form-control"
             placeholder="e.g. Purifying Facial Cleanser"
             autocomplete="off"
             required>
    </div>

    <div class="mb-4">
      <label for="product-origin" class="form-label">Product Origin / Link</label>
      <input type="text"
             id="product-origin"
             name="origin"
             class="form-control"
             placeholder="https://amazon.com/..."
             autocomplete="off">
      <div class="form-text mt-2">Optional - Add a link for quick reference later.</div>
    </div>

    <hr class="form-divider">

    <div class="mb-2">
      <label class="form-label">Ingredient List <span style="color: #e07a7a;">*</span></label>
      <div class="ingredient-tag-box" id="ingredient-tag-box" onclick="document.getElementById('ingredient-tag-input').focus()">
        <input
          id="ingredient-tag-input"
          class="ingredient-tag-input"
          type="text"
          placeholder="Add ingredients (split with comma + space)..."
          autocomplete="off"
          oninput="handleIngredientInput(event)"
          onkeydown="handleIngredientKeydown(event)">
      </div>
      <div id="ingredient-hidden-inputs"></div>
      <div class="form-text mt-2">To preserve names like "1,2-Hexanediol", separate items with a comma and a space (", ").</div>
    </div>

    <hr class="form-divider">

    <div class="d-flex justify-content-end gap-3">
      <button type="button" class="btn-form-cancel" data-bs-dismiss="modal">Discard</button>
      <button type="submit" class="btn-form-submit">
        Create Product
      </button>
    </div>
  </form>
</div>

<script>
  function handleIngredientInput(e) {
    const raw = e.target.value;
    const parts = raw.split(', ');
    if (parts.length > 1) {
      parts.slice(0, -1).forEach(p => commitIngredient(p.trim()));
      e.target.value = parts[parts.length - 1];
    }
  }

  function handleIngredientKeydown(e) {
    const input = e.target;
    if ((e.key === 'Enter' || e.key === 'Tab') && input.value.trim()) {
      e.preventDefault();
      commitIngredient(input.value.trim());
      input.value = '';
    }
    if (e.key === 'Backspace' && input.value === '') {
      const box = document.getElementById('ingredient-tag-box');
      const tags = box.querySelectorAll('.ingredient-tag');
      if (tags.length > 0) {
        const lastTag = tags[tags.length - 1];
        removeIngredient(lastTag.dataset.name, lastTag);
      }
    }
  }

  function commitIngredient(name) {
    if (!name) return;
    const box = document.getElementById('ingredient-tag-box');
    const hiddenContainer = document.getElementById('ingredient-hidden-inputs');
    const input = document.getElementById('ingredient-tag-input');

    if (box.querySelector(`.ingredient-tag[data-name="${CSS.escape(name)}"]`)) return;

    const tag = document.createElement('span');
    tag.className = 'ingredient-tag';
    tag.dataset.name = name;
    tag.innerHTML = `${name}<button type="button" class="ingredient-tag-remove" onclick="removeIngredient('${name.replace(/'/g, "\\'")}', this.parentElement)"><i class="bi bi-x"></i></button>`;
    box.insertBefore(tag, input);

    const hidden = document.createElement('input');
    hidden.type = 'hidden';
    hidden.name = 'ingredient_names';
    hidden.value = name;
    hidden.dataset.tag = name;
    hiddenContainer.appendChild(hidden);
  }

  function removeIngredient(name, tagEl) {
    tagEl.remove();
    const hidden = document.querySelector(`#ingredient-hidden-inputs input[data-tag="${CSS.escape(name)}"]`);
    if (hidden) hidden.remove();
  }
</script>
