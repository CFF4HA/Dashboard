<h5 hx-swap-oob="true" id="side-modal-label" style="font-weight: 700; color: var(--forest-green);">
    <i class="bi bi-bookmark-plus me-2"></i>Monitor an Ingredient
  </h5>
  
  <style>
    /* ── Monitor Form Styles ── */
    .monitor-form-search-wrap {
      position: relative;
    }
  
    .monitor-form-search-input {
      width: 100%;
      background: var(--soft-white, #f8faf8);
      border: 1.5px solid var(--apothecary-border, #e8ede9);
      border-radius: 14px;
      padding: 0.7rem 1rem 0.7rem 2.75rem;
      font-size: 0.9rem;
      color: var(--forest-green, #1a2e1c);
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }
  
    .monitor-form-search-input:focus {
      border-color: var(--forest-green, #1a2e1c);
      background: #fff;
      box-shadow: 0 4px 16px rgba(26,46,28,0.07);
    }
  
    .monitor-form-search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #adb5bd;
      pointer-events: none;
    }
  
    /* ── Ingredient Option Row ── */
    .monitor-option-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      background: #fff;
      border: 1.5px solid var(--apothecary-border, #e8ede9);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 0.5rem;
    }
  
    .monitor-option-row:hover {
      border-color: var(--forest-green, #1a2e1c);
      box-shadow: 0 4px 12px rgba(26,46,28,0.06);
    }
  
    .monitor-option-row.selected {
      border-color: #4ade80;
      background: #f0fdf4;
    }
  
    .monitor-option-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--soft-white, #f8faf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--forest-green, #1a2e1c);
      flex-shrink: 0;
    }
  
    .monitor-option-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--forest-green, #1a2e1c);
      line-height: 1.2;
    }
  
    .monitor-option-meta {
      font-size: 0.68rem;
      color: #94a3b8;
      margin-top: 0.1rem;
    }
  
    .monitor-option-check {
      margin-left: auto;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
      font-size: 0.65rem;
      color: #fff;
    }
  
    .monitor-option-row.selected .monitor-option-check {
      background: #4ade80;
      border-color: #4ade80;
    }
  
    /* ── Already Monitored Badge ── */
    .monitor-option-already {
      font-size: 0.62rem;
      background: #dcfce7;
      color: #15803d;
      border-radius: 6px;
      padding: 0.15rem 0.45rem;
      font-weight: 700;
      margin-left: auto;
      flex-shrink: 0;
    }
  
    /* ── Confirm Button ── */
    .monitor-form-confirm {
      background: var(--forest-green, #1a2e1c);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 0.85rem 1.5rem;
      font-weight: 700;
      font-size: 0.9rem;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
  
    .monitor-form-confirm:hover {
      background: #2d4a30;
      box-shadow: 0 6px 20px rgba(26,46,28,0.2);
    }
  
    .monitor-form-confirm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  
    /* ── Divider ── */
    .monitor-form-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #cbd5e1;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 1.25rem 0;
    }
  
    .monitor-form-divider::before,
    .monitor-form-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8ede9;
    }
  
    /* ── New Ingredient Input ── */
    .monitor-new-row {
      display: flex;
      gap: 0.5rem;
    }
  
    .monitor-new-input {
      flex: 1;
      background: var(--soft-white, #f8faf8);
      border: 1.5px solid var(--apothecary-border, #e8ede9);
      border-radius: 12px;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      color: var(--forest-green, #1a2e1c);
      outline: none;
      transition: border-color 0.2s;
    }
  
    .monitor-new-input:focus {
      border-color: var(--forest-green, #1a2e1c);
      background: #fff;
    }
  </style>
  
  <script>
    (function() {
      let selected = new Set();
  
      function toggleSelect(id, el) {
        if (el.dataset.alreadyMonitored) return;
        const row = el.closest('.monitor-option-row');
        if (selected.has(id)) {
          selected.delete(id);
          row.classList.remove('selected');
        } else {
          selected.add(id);
          row.classList.add('selected');
        }
        document.getElementById('monitor-confirm-btn').disabled = selected.size === 0;
        document.getElementById('monitor-confirm-btn').textContent =
          selected.size > 0 ? `Monitor ${selected.size} Ingredient${selected.size > 1 ? 's' : ''}` : 'Select ingredients above';
      }
  
      window._monitorToggle = toggleSelect;
  
      window._monitorConfirm = async function() {
        const ids = Array.from(selected);
        const btn = document.getElementById('monitor-confirm-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
  
        for (const id of ids) {
          await fetch('/user/monitor', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'id=' + encodeURIComponent(id)
          });
        }
  
        // Refresh the monitor page content or show success
        const notification = document.getElementById('notification');
        if (notification) {
          notification.innerHTML = `<div class="alert alert-success py-2 px-3 shadow-sm">Added ${ids.length} ingredient${ids.length > 1 ? 's' : ''} to monitoring.</div>`;
        }
  
        bootstrap.Offcanvas.getInstance(document.getElementById('side-modal'))?.hide();
        // If on monitor page, trigger a refresh
        htmx.trigger(document.body, 'monitorUpdated');
      };
    })();
  </script>
  
  <div class="px-1 pb-3">
  
    <!-- Search box within existing ingredients -->
    <div class="monitor-form-search-wrap mb-3">
      <i class="bi bi-search monitor-form-search-icon"></i>
      <input
        class="monitor-form-search-input"
        type="text"
        placeholder="Search existing ingredients..."
        hx-get="/htmx/ingredient-monitor-options"
        hx-trigger="keyup changed delay:300ms, load"
        hx-target="#monitor-options-list"
        hx-include="this"
        name="query">
    </div>
  
    <!-- Options list -->
    <div id="monitor-options-list" style="max-height: 340px; overflow-y: auto;">
      <div class="text-center py-4">
        <div class="spinner-border spinner-border-sm text-success"></div>
      </div>
    </div>
  
    <!-- Divider -->
    <div class="monitor-form-divider">or fetch from PubChem</div>
  
    <!-- Add a new ingredient by name -->
    <div class="monitor-new-row mb-4">
      <input
        id="monitor-new-name"
        class="monitor-new-input"
        type="text"
        placeholder="Chemical name (e.g., Retinol)...">
      <button class="btn btn-outline-success rounded-3 px-3"
              style="font-size: 0.8rem; font-weight: 700; white-space: nowrap;"
              onclick="(async function() {
                const val = document.getElementById('monitor-new-name').value.trim();
                if (!val) return;
                await fetch('/ingredient', {
                  method: 'PUT',
                  headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                  body: 'name=' + encodeURIComponent(val) + '&monitor=true'
                });
                htmx.trigger(document.querySelector('[name=query]'), 'keyup');
              })()">
        <i class="bi bi-cloud-download me-1"></i>Fetch &amp; Monitor
      </button>
    </div>
  
    <!-- Confirm button -->
    <button id="monitor-confirm-btn"
            class="monitor-form-confirm"
            disabled
            onclick="_monitorConfirm()">
      Select ingredients above
    </button>
  
  </div>
