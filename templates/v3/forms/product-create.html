<style>
  .scrape-btn .loading-text { display: none; }
  .scrape-btn.htmx-request .idle-text { display: none; }
  .scrape-btn.htmx-request .loading-text { display: inline-flex; align-items: center; gap: 0.4rem; }
</style>
<div class="container py-4">
  <div class="row g-5 align-items-start">
    <div class="col">
      <h5 class="mb-1">Easy. Simple. Create.</h5>
      <p class="text-muted small mb-4">Add a product by pasting a link and we'll handle the rest.</p>

      <div class="mb-3">
        <label for="product-link" class="form-label fw-semibold">Product Link</label>
        <input type="url" class="form-control" id="product-link" placeholder="https://www.amazon.com/dp/B08N5WRWNW/" name="url">
        <div class="form-text">Paste a link to the product you want to submit. We'll scrape the product information automatically.</div>
      </div>

      <div class="d-flex justify-content-between">
        <a class="" href="#" style="line-height: 3;"
          hx-get="/htmx/product-create_manual"
          hx-target="#modal-content"
          hx-swap="innerHTML"
          hx-trigger="click"
        >Manually import a product.</a>

        <div class="btn-group me-2">
          <button type="submit" class="btn btn-dark px-4 scrape-btn"
            hx-get="/product/scrape"
            hx-include="#product-link"
            hx-disabled-elt="this"
            hx-indicator="#scrape-status"
            hx-swap="none"
          >
            <span class="idle-text"><strong>Create My Product</strong></span>
            <span class="loading-text">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              Scraping&hellip;
            </span>
          </button>
        </div>
      </div>

      <p id="scrape-status" class="htmx-indicator text-muted small mt-2 mb-0">
        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        Scraping product information, this may take a moment&hellip;
      </p>
    </div>

  </div>
</div>
