<div class="container py-4">
  <div class="row g-5 align-items-start">
    <div class="col">
      <h5 class="mb-1">Easy. Simple. Create.</h5>
      <p class="text-muted small mb-4">Add a product by pasting a link and we'll handle the rest.</p>

      <div class="mb-3">
        <label for="product-link" class="form-label fw-semibold">Product Link</label>
        <input type="url" class="form-control" id="product-link" placeholder="https://www.amazon.com/dp/B08N5WRWNW/">
        <div class="form-text">Paste a link to the product you want to submit. We'll scrape the product information automatically.</div>
      </div>

      <div class="d-flex justify-content-between">
        <a class="" href="#" style="line-height: 3;"
          hx-get="/htmx/product-create_manual"
          hx-target="#modal-content"
          hx-swap="innerHTML"
          hx-trigger="click"
        >Manually import a product.</a>

        <div class="btn-group me-2">
          <button type="submit" class="btn btn-dark px-4"><strong>Create My Product</strong></button>
        </div>
      </div>
    </div>

  </div>
</div>
