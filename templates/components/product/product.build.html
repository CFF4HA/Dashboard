{{ define "component-product_build_form" }}
<div class="product-draft-container border border-dark p-4 bg-white shadow-sm" style="border-radius: 2rem;">
    <div class="d-flex justify-content-between align-items-center mb-4 px-2">
        <div>
            <h2 class="h6 text-uppercase fw-black tracking-widest m-0">Product Composition</h2>
        </div>
        <span class="badge rounded-pill border border-dark text-dark fw-bold px-3" style="font-size: 0.7rem;">
            {{ len .Product.Ingredients }} ITEMS
        </span>
    </div>

    <div id="builder-ingredient-list" class="mb-4" style="max-height: 400px; overflow-y: auto;">
        {{- range .Product.Ingredients }}
        <div class="mt-2" hx-get="/component/product/draft/ingredient?name={{ .Name }}" hx-trigger="load" hx-swap="outerHTML"></div>
        {{- else }}
        <div class="text-center py-5 border border-dashed rounded-4">
            <p class="text-uppercase small tracking-widest text-muted m-0">No ingredients added to draft</p>
        </div>
        {{- end }}
    </div>

  <div class="p-1 m-1 d-flex flex-direction-ciolumn gap-2">
    <input id="input-product_name" name="input-product_name" type="text" class="form-control" placeholder="Insert Product Name">
    <input id="input-product_origin" name="input-product_origin" type="text" class="form-control" placeholder="Insert Product Origin">
  </div>

    <div class="px-2">
        <button class="btn-create-product w-100 py-3 text-uppercase fw-black tracking-widest border-0"
            onclick="createProduct()"
                {{ if lt (len .Product.Ingredients) 1 }}disabled{{ end }}>
            Create Product Record
        </button>
    </div>
</div>

<script>
function getProductData() {
  
  return {
    name: document.getElementById('input-product_name').value,
    origin: document.getElementById('input-product_origin').value,
    ingredients: Array.from(document.querySelectorAll('.input-ingredient_name')).map(el => el.value)
  }
}

function createProduct() {
  const productData = getProductData();

  fetch('/api/product', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(productData)
  }).then(
    () => {
      document.getElementById('builder-ingredient-list').innerHTML = '';
    }
  );
}
</script>

<style>
    .fw-black { font-weight: 900; }
    .border-dashed { border-style: dashed !important; border-color: #dee2e6 !important; }
    
    .ingredient-card-item:hover {
        background-color: #f8f9fa;
    }

    .btn-create-product {
        background-color: #000;
        color: #fff;
        border-radius: 1.25rem;
        font-size: 0.8rem;
        transition: all 0.2s ease;
    }

    .btn-create-product:hover:not(:disabled) {
        background-color: #222;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .btn-create-product:disabled {
        background-color: #e9ecef;
        color: #adb5bd;
        cursor: not-allowed;
    }

    /* Custom scrollbar for the list */
    #builder-ingredient-list::-webkit-scrollbar { width: 4px; }
    #builder-ingredient-list::-webkit-scrollbar-thumb { background: #000; border-radius: 10px; }
</style>
{{ end }}
{{ template "component-product_build_form" . }}
