{{ define "component-searchbar" }}
<!-- Search Bar -->
<div class="card mb-4">
  <div class="card-body">
    <div class="input-group">
      <input id="search-ingredient_name" name="name" type="text" class="form-control form-control-lg" placeholder="Search ingredients..." placeholder="Search for..."
        hx-get="/component/search/ingredient" hx-trigger="keyup delay:500ms" hx-target="#search-results" hx-swap="innerHTML" hx-include="#search-ingredient_name" />
      <button class="btn btn-light"
        hx-get="/api/ingredient"
        hx-include="#search-ingredient_name"
        hx-trigger="click"
        hx-swap="none"
        hx-on:htmx:after-request="htmx.trigger('#search-ingredient_name', 'keyup')"
        hx-on:htmx:before-request="document.getElementById('search-results').innerHTML = `
        <div class='loading-overlay py-5 text-center'>
            <div class='scanning-line mb-3'></div>
            <div class='font-monospace small text-uppercase tracking-widest'>
                Querying Registry<span class='dot-animate'>...</span>
            </div>
            <div class='text-muted mt-2 font-monospace' style='font-size: 0.6rem;'>
                STATUS: SYNC_IN_PROGRESS
            </div>
        </div>
       `"
      ><i class="bi bi-plus-square-fill"></i></button>
    </div>
  </div>
</div>

<style>
/* Scanning animation for the loading state */
.scanning-line {
    width: 60px;
    height: 2px;
    background: #000;
    margin: 0 auto;
    animation: scan 1s infinite ease-in-out;
}

@keyframes scan {
    0% { transform: scaleX(0.2); opacity: 0.2; }
    50% { transform: scaleX(1.5); opacity: 1; }
    100% { transform: scaleX(0.2); opacity: 0.2; }
}

/* Typing ellipsis animation */
.dot-animate {
    display: inline-block;
    animation: dots 1.5s infinite;
    width: 1.5em;
    text-align: left;
}

@keyframes dots {
    0% { content: ''; }
    33% { content: '.'; }
    66% { content: '..'; }
    100% { content: '...'; }
}

/* Subtle pulse for the whole container */
.loading-overlay {
    animation: pulse-opacity 2s infinite ease-in-out;
}

@keyframes pulse-opacity {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}
</style>
{{ end }}
{{ template "component-searchbar" . }}
