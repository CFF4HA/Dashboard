services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://dashboard:dashboard@db:5432/dashboard?sslmode=disable
      OLLAMA_HTTP_ADDRESS: http://localhost:11434
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
